<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ещё</title>
<style>
:root {
    --bg-deep: #12110f; --bg: #161513; --card: #1c1a18; --raised: #262421;
    --line: rgba(239, 233, 222, 0.08); --line-strong: rgba(239, 233, 222, 0.14);
    --text: #efe9de; --text-2: #aaa398; --text-3: #8a847a;
    --accent: #e3a54a; --primary: #efe9de; --on-primary: #161513;
    --pos: #4cc38a; --neg: #e5484d;
    --mono: "Roboto Mono", ui-monospace, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/22px system-ui, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
main { padding: 16px 16px 32px; max-width: 640px; margin: 0 auto; }
h1 { margin: 4px 0 16px; font-size: 20px; line-height: 28px; font-weight: 500; }
h2 { margin: 24px 0 8px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-2); }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { padding: 12px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--text-3); }
.small { font-size: 13px; line-height: 20px; }
.hint { font-size: 12px; line-height: 16px; color: var(--text-3); margin: 4px 0 0; }
.mono { font-family: var(--mono); font-size: 12px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 17px; line-height: 24px; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--text-3); flex: none; }
.dot.on { background: var(--pos); }
.dot.wait { background: var(--accent); }
.message { margin: 8px 0 0; color: var(--text-2); font-size: 14px; line-height: 20px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn { height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font: inherit; font-weight: 500; cursor: pointer; transition: background-color 150ms var(--ease), opacity 150ms var(--ease); }
.btn:active { transform: scale(0.98); }
.btn[disabled] { opacity: 0.5; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.secondary { background: var(--raised); color: var(--text); border-color: var(--line); }
.btn.small { height: 36px; padding: 0 12px; font-size: 14px; }
.btn.quiet { background: transparent; color: var(--text-2); }
.step { display: grid; grid-template-columns: 24px 1fr; gap: 8px; }
.num { font-family: var(--mono); font-size: 12px; color: var(--text-3); padding-top: 2px; }
.done .num { color: var(--pos); }
code { display: block; margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--bg-deep); font-family: var(--mono); font-size: 12px; line-height: 18px; color: var(--text-2); overflow-wrap: anywhere; }
input[type="text"] { width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg-deep); color: var(--text); font-family: var(--mono); font-size: 13px; }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; }
.switch span { position: absolute; inset: 0; border-radius: 13px; background: var(--raised); border: 1px solid var(--line-strong); pointer-events: none; transition: background-color 150ms var(--ease); }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 9px; background: var(--text-3); transition: transform 150ms var(--ease); }
.switch input:checked + span { background: var(--accent); border-color: transparent; }
.switch input:checked + span::after { transform: translateX(18px); background: #1d1608; }
.badge { font-family: var(--mono); font-size: 12px; color: var(--accent); }
a { color: var(--accent); }
.error { margin: 8px 0 0; font-size: 13px; line-height: 18px; color: #f0a0a2; overflow-wrap: anywhere; }
pre.log { margin: 8px 0 0; padding: 8px 12px; max-height: 320px; overflow: auto; border-radius: 8px; background: var(--bg-deep); font-family: var(--mono); font-size: 11px; line-height: 16px; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.field + .field { margin-top: 12px; }
</style>
</head>
<body>
<main id="root"></main>
<script>
(function () {
    'use strict';
    var app = window.KorrektorApp;
    var state = {};
    var updates = null;
    var checking = false;
    var logs = null;          // text of the logs, when shown
    var logsLoading = false;
    var drafts = {};          // what the user typed and has not saved yet
    var pendingRender = false;
    var siteList = [];        // provider sites of the "Sites" tab
    var siteEdit = null;      // index being edited, or 'new'
    var root = document.getElementById('root');

    function h(tag, props) {
        var el = document.createElement(tag);
        props = props || {};
        Object.keys(props).forEach(function (k) {
            var v = props[k];
            if (v === undefined || v === null || v === false) return;
            if (k === 'class') el.className = v;
            else if (k === 'text') el.textContent = v;
            else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
            else el.setAttribute(k, v === true ? '' : v);
        });
        for (var i = 2; i < arguments.length; i++) {
            [].concat(arguments[i]).forEach(function (c) {
                if (c === null || c === undefined || c === false) return;
                el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
            });
        }
        return el;
    }

    function toggle(label, hint, checked, onchange) {
        var input = h('input', { type: 'checkbox', 'aria-label': label });
        input.checked = !!checked;
        input.addEventListener('change', function () { onchange(input.checked); });
        return h('div', { class: 'row' },
            h('div', { class: 'line' }, h('span', { text: label }), h('span', { class: 'switch' }, input, h('span'))),
            hint ? h('p', { class: 'hint', text: hint }) : null);
    }

    // A text field with a "Save" button. Tapping the button keeps focus in the field,
    // so the page does not redraw under the finger.
    function field(key, label, value, placeholder, onsave, hint) {
        var input = h('input', { type: 'text', 'aria-label': label, placeholder: placeholder || '', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' });
        input.value = drafts[key] !== undefined ? drafts[key] : (value || '');
        input.addEventListener('input', function () { drafts[key] = input.value; });
        var save = h('button', { class: 'btn secondary small', type: 'button', text: 'Сохранить',
            onmousedown: function (e) { e.preventDefault(); },
            onclick: function () { delete drafts[key]; onsave(input.value.trim()); input.blur(); } });
        return h('div', { class: 'field' },
            h('span', { class: 'small muted', text: label }),
            h('div', { class: 'line', style: 'margin-top:4px' }, input, save),
            hint ? h('p', { class: 'hint' }, hint) : null);
    }

    function startTavern() {
        app.action(state.autoUpdate ? 'start-update' : 'start');
    }

    function showLogs() {
        logsLoading = true;
        if (logs === null) logs = '';
        render();
        app.action('logs');
    }

    function when(ms) {
        if (!ms) return 'ещё не проверялось';
        var d = new Date(ms);
        return 'проверено ' + d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ' в ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function tavernSection() {
        var s = state;
        var dot = s.stUp ? 'on' : s.starting ? 'wait' : '';
        var title = s.stUp ? 'SillyTavern работает' : s.starting ? 'SillyTavern запускается' : 'SillyTavern не запущен';
        var actions = [];
        if (s.stUp) {
            actions.push(h('button', { class: 'btn primary', type: 'button', onclick: function () { app.showTab('tavern'); }, text: 'Открыть таверну' }));
            actions.push(h('button', { class: 'btn secondary', type: 'button', onclick: function () { app.action('restart'); }, text: 'Перезапустить' }));
            actions.push(h('button', { class: 'btn quiet', type: 'button', onclick: function () { app.action('stop'); }, text: 'Остановить' }));
        } else {
            actions.push(h('button', { class: 'btn primary', type: 'button', disabled: s.starting, onclick: startTavern, text: s.starting ? 'Запускаю' : 'Запустить' }));
            if (s.starting) actions.push(h('button', { class: 'btn quiet', type: 'button', onclick: function () { app.action('stop'); }, text: 'Остановить' }));
        }
        actions.push(h('button', { class: 'btn quiet', type: 'button', onclick: showLogs, text: 'Журнал' }));

        var logRow = logs === null ? null : h('div', { class: 'row' },
            h('div', { class: 'line' },
                h('span', { class: 'small muted', text: logsLoading ? 'Читаю журнал…' : 'Журнал (последние строки)' }),
                h('div', { style: 'display:flex;gap:4px;flex:none' },
                    h('button', { class: 'btn quiet small', type: 'button', onclick: showLogs, text: 'Обновить' }),
                    h('button', { class: 'btn quiet small', type: 'button', onclick: function () { logs = null; render(); }, text: 'Скрыть' }))),
            logs ? h('pre', { class: 'log', text: logs }) : null);

        var found = s.stDir ? 'Сейчас найдена папка ' + s.stDir.replace(/^\/data\/data\/com\.termux\/files\/home/, '~') + '. ' : '';
        return [
            h('div', { class: 'box' },
                h('div', { class: 'row' },
                    h('div', { class: 'status' }, h('span', { class: 'dot ' + dot }), title),
                    s.message && s.message !== title ? h('p', { class: 'message', text: s.message }) : null,
                    h('div', { class: 'actions' }, actions)),
                logRow,
                h('div', { class: 'row' },
                    field('cmd', 'Команда запуска в Termux', s.startCmd, 'автоматически', function (v) { app.setStartCommand(v); },
                        found + 'Пусто — Корректор сам найдёт папку SillyTavern и запустит start.sh. Если вы запускаете таверну своей командой (например st), впишите её сюда'),
                    field('url', 'Адрес SillyTavern', s.stUrl, 'http://127.0.0.1:8000', function (v) { app.setUrl(v); },
                        'Обычно http://127.0.0.1:8000. Если в config.yaml SillyTavern другой порт, укажите его'))),
        ];
    }

    function setupSection() {
        var s = state;
        var ready = s.termuxReady === true;
        var tavernKnown = !!(s.stDir || s.startCmd);
        if (s.termuxInstalled && s.termuxPermission && ready && tavernKnown) return null;
        function step(n, done, title, body) {
            return h('div', { class: 'row step' + (done ? ' done' : '') }, h('span', { class: 'num', text: done ? 'ok' : String(n) }), h('div', {}, h('div', { text: title }), body));
        }
        function btn(text, onclick, primary, disabled) {
            return h('button', { class: 'btn ' + (primary ? 'primary' : 'secondary') + ' small', type: 'button', disabled: disabled, onclick: onclick, text: text });
        }

        var permissionBody = s.termuxPermission ? null : [
            h('div', { class: 'actions' },
                btn('Разрешить', function () { app.requestTermux(); }, true, !s.termuxInstalled),
                s.permissionDenied ? btn('Открыть настройки', function () { app.openAppSettings(); }) : null),
            s.permissionDenied ? h('p', { class: 'hint', text: 'Если окно с запросом не появилось: настройки приложения → Разрешения → Дополнительные разрешения → «Выполнять команды в среде Termux»' }) : null];

        var termuxBody = ready ? null : [
            h('code', { text: s.termuxSetup || '' }),
            h('div', { class: 'actions' },
                btn('Скопировать', function () { app.copy(s.termuxSetup); }),
                btn('Открыть Termux', function () { app.openTermux(); }),
                s.termuxPermission ? btn(s.termuxChecking ? 'Проверяю…' : 'Проверить', function () { app.recheck(); }, false, s.termuxChecking) : null),
            s.termuxReady === false && s.termuxError ? h('p', { class: 'error', text: s.termuxError }) : null,
            s.termuxPermission ? null : h('p', { class: 'hint', text: 'Проверить получится после шага 2' })];

        var tavernTitle = s.stDir ? 'SillyTavern найден: ' + s.stDir.replace(/^\/data\/data\/com\.termux\/files\/home/, '~')
            : s.startCmd ? 'Таверна запускается командой: ' + s.startCmd
            : 'SillyTavern в Termux';
        var tavernBody = tavernKnown ? null : ready ? [
            h('p', { class: 'hint', text: 'В домашней папке Termux SillyTavern не найден. Кнопка ниже откроет Termux и поставит SillyTavern с Корректором, это займёт 5–15 минут. Если таверна уже стоит в другом месте или запускается своей командой, впишите команду выше' }),
            h('div', { class: 'actions' }, btn('Установить SillyTavern', function () {
                if (confirm('Установить SillyTavern в Termux? Откроется Termux, там будет видно, как идёт установка')) app.action('install-tavern');
            }, true))]
            : h('p', { class: 'hint', text: 'Проверю после шагов 2 и 3' });

        return [
            h('h2', { text: 'Первая настройка' }),
            h('div', { class: 'box' },
                step(1, s.termuxInstalled, 'Установите Termux из F-Droid или GitHub',
                    s.termuxInstalled ? null : h('div', { class: 'actions' }, btn('Открыть F-Droid', function () { app.openLink('termux'); }))),
                step(2, s.termuxPermission, 'Разрешите Корректору запускать команды в Termux', permissionBody),
                step(3, ready, 'Разрешите Termux принимать команды от приложений: выполните в Termux', termuxBody),
                step(4, tavernKnown, tavernTitle, tavernBody)),
        ];
    }

    function updatesSection() {
        var s = state;
        var u = updates || {};
        var appInfo = u.app || {};
        var kInfo = u.korrektor || {};
        var appRow = h('div', { class: 'row' },
            h('div', { class: 'line' },
                h('div', {}, h('div', { text: 'Приложение' }), h('div', { class: 'small muted', text: 'версия ' + (s.appVersion || '?') + (appInfo.latest ? ' · последняя ' + appInfo.latest : '') })),
                appInfo.available ? h('button', { class: 'btn primary small', type: 'button', onclick: function () { app.installApp(); }, text: 'Обновить' })
                    : h('span', { class: 'small muted', text: appInfo.error ? appInfo.error : updates ? 'актуальная' : '' })),
            appInfo.available && !s.canInstall ? h('p', { class: 'hint', text: 'Android спросит разрешение устанавливать приложения: включите его для Корректора и вернитесь' }) : null);
        var kRow = h('div', { class: 'row' },
            h('div', { class: 'line' },
                h('div', {}, h('div', { text: 'Корректор в SillyTavern' }), h('div', { class: 'small muted', text: (kInfo.current ? 'версия ' + kInfo.current : s.stUp ? 'версия неизвестна' : 'SillyTavern не запущен') + (kInfo.latest ? ' · последняя ' + kInfo.latest : '') })),
                h('button', { class: 'btn ' + (kInfo.available ? 'primary' : 'secondary') + ' small', type: 'button', onclick: function () { app.action('update-korrektor'); }, text: kInfo.available ? 'Обновить' : 'Переустановить' })),
            h('p', { class: 'hint', text: 'Скачает новую версию в ~/korrektor-src, поставит её и перезапустит SillyTavern' }));
        var stRow = h('div', { class: 'row' },
            h('div', { class: 'line' },
                h('div', {}, h('div', { text: 'SillyTavern' }), h('div', { class: 'small muted', text: 'git pull в папке таверны' })),
                h('button', { class: 'btn secondary small', type: 'button', onclick: function () {
                    if (confirm('Обновить SillyTavern до последней версии? Таверна перезапустится, первый запуск после обновления может занять несколько минут')) app.action('update-tavern');
                }, text: 'Обновить' })));
        return [
            h('h2', { text: 'Обновления' }),
            h('div', { class: 'box' },
                appRow, kRow, stRow,
                h('div', { class: 'row line' },
                    h('span', { class: 'small muted', text: checking ? 'проверяю…' : when(s.lastCheck) }),
                    h('button', { class: 'btn secondary small', type: 'button', disabled: checking, onclick: function () { checking = true; render(); app.checkUpdates(); }, text: 'Проверить' }))),
            h('div', { class: 'box', style: 'margin-top:12px' },
                toggle('Обновлять Корректор сам', 'Перед каждым запуском SillyTavern из приложения: если на GitHub новая версия, она ставится до старта, ничего не прерывая', s.autoUpdate, function (v) { app.setFlag('autoUpdate', v); }),
                toggle('Запускать SillyTavern при открытии', 'Если таверна не работает, приложение запустит её через Termux', s.autoStart, function (v) { app.setFlag('autoStart', v); })),
        ];
    }

    function sitesSection() {
        var s = state;
        function saveList(list) {
            app.setSites(JSON.stringify(list));
        }
        function form(index) {
            var item = index === 'new' ? { name: '', url: '' } : siteList[index];
            var name = h('input', { type: 'text', 'aria-label': 'Название', placeholder: 'Название, например Link API', autocomplete: 'off' });
            var url = h('input', { type: 'text', 'aria-label': 'Адрес', placeholder: 'https://…', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false', style: 'margin-top:8px' });
            name.value = drafts.siteName !== undefined ? drafts.siteName : item.name;
            url.value = drafts.siteUrl !== undefined ? drafts.siteUrl : item.url;
            name.addEventListener('input', function () { drafts.siteName = name.value; });
            url.addEventListener('input', function () { drafts.siteUrl = url.value; });
            function done() {
                delete drafts.siteName;
                delete drafts.siteUrl;
                siteEdit = null;
                if (document.activeElement) document.activeElement.blur();
                render();
            }
            var keep = function (e) { e.preventDefault(); };
            return h('div', { class: 'row' }, name, url,
                h('div', { class: 'actions' },
                    h('button', { class: 'btn primary small', type: 'button', onmousedown: keep, onclick: function () {
                        var list = siteList.slice();
                        var entry = { name: name.value.trim(), url: url.value.trim() };
                        if (!entry.name || !entry.url) { alert('Впишите название и адрес'); return; }
                        if (index === 'new') list.push(entry); else list[index] = entry;
                        saveList(list);
                        done();
                    }, text: 'Сохранить' }),
                    h('button', { class: 'btn quiet small', type: 'button', onmousedown: keep, onclick: done, text: 'Отмена' })));
        }
        var rows = siteList.map(function (item, i) {
            if (siteEdit === i) return form(i);
            return h('div', { class: 'row' },
                h('div', { class: 'line' },
                    h('div', { style: 'min-width:0' }, h('div', { text: item.name }), h('div', { class: 'small muted', style: 'overflow-wrap:anywhere', text: item.url.replace(/^https?:\/\//, '') })),
                    h('button', { class: 'btn secondary small', type: 'button', onclick: function () { app.openSite(i); }, text: 'Открыть' })),
                h('div', { class: 'actions', style: 'margin-top:4px' },
                    h('button', { class: 'btn quiet small', type: 'button', onclick: function () { siteEdit = i; render(); }, text: 'Изменить' }),
                    h('button', { class: 'btn quiet small', type: 'button', onclick: function () {
                        if (!confirm('Убрать «' + item.name + '» из списка?')) return;
                        var list = siteList.slice();
                        list.splice(i, 1);
                        saveList(list);
                    }, text: 'Убрать' })));
        });
        return [
            h('h2', { id: 'sites', text: 'Сайты провайдеров' }),
            h('div', { class: 'box' },
                toggle('Вкладка «Сайты»', 'Сайты провайдеров ИИ прямо в приложении: войти, взять ключ, сменить модель, пополнить баланс. Ключ потом вставьте в таверне, в настройках подключения к API', s.showSites, function (v) { app.setFlag('showSites', v); }),
                rows,
                siteEdit === 'new' ? form('new') : h('div', { class: 'row' },
                    h('button', { class: 'btn secondary small', type: 'button', onclick: function () { siteEdit = 'new'; render(); }, text: 'Добавить сайт' }),
                    h('p', { class: 'hint', text: 'Вход через Google внутри приложения может не сработать: войдите по почте или откройте сайт кнопкой «В браузере» на вкладке «Сайты»' }))),
        ];
    }

    function notifySection() {
        var s = state;
        return [
            h('h2', { text: 'Уведомления' }),
            h('div', { class: 'box' },
                toggle('Новые замечания и обновления', 'Раз в час, пока работает SillyTavern. Если уведомления приходят дважды, выключите «Уведомление Android о находках» в настройках Корректора', s.notify, function (v) { app.setFlag('notify', v); }),
                s.notifications ? null : h('div', { class: 'row line' }, h('span', { class: 'small muted', text: 'Android сейчас не разрешает уведомления' }),
                    h('button', { class: 'btn secondary small', type: 'button', onclick: function () { app.requestNotifications(); }, text: 'Разрешить' }))),
        ];
    }

    function typing() {
        var el = document.activeElement;
        return el && el.tagName === 'INPUT' && el.type === 'text' && root.contains(el);
    }

    function render() {
        // Redrawing would drop what is being typed: wait until the field loses focus.
        if (typing()) {
            pendingRender = true;
            return;
        }
        pendingRender = false;
        root.replaceChildren.apply(root, [].concat(
            h('h1', { text: 'Корректор' }),
            tavernSection(),
            setupSection() || [],
            updatesSection(),
            sitesSection(),
            notifySection(),
            h('p', { class: 'hint', style: 'margin-top:24px' }, 'Журналы в Termux: ~/.korrektor-ctl.log и ~/.korrektor-st.log · ',
                h('a', { href: '#', onclick: function (e) { e.preventDefault(); app.openLink('project'); }, text: 'проект на GitHub' }))
        ).filter(Boolean));
    }

    function refresh() {
        try {
            state = JSON.parse(app.state());
        } catch (e) {
            state = {};
        }
        try {
            siteList = JSON.parse(app.sites()) || [];
        } catch (e) {
            siteList = [];
        }
        render();
    }

    root.addEventListener('focusout', function () {
        if (pendingRender) setTimeout(render, 250);
    });

    window.onNative = function (type, data) {
        if (type === 'updates') {
            updates = data;
            checking = false;
        }
        if (type === 'focus' && data && data.section) {
            refresh();
            var target = document.getElementById(data.section);
            if (target) target.scrollIntoView({ block: 'start' });
            return;
        }
        if (type === 'logs') {
            logs = (data && data.text) || '';
            logsLoading = false;
        }
        refresh();
    };

    refresh();
    setInterval(function () { if (state.starting || state.termuxChecking) refresh(); }, 2000);
    if (!state.lastCheck || Date.now() - state.lastCheck > 6 * 3600 * 1000) {
        checking = true;
        render();
        app.checkUpdates();
    }
})();
</script>
</body>
</html>

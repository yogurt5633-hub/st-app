name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time.
concurrency:
  group: android-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Updates install over the old app only if every APK has the same signing key.
      # The key lives only in repository secrets; scripts/setup-signing.sh puts it there.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KORREKTOR_KEYSTORE_BASE64 }}
          PW: ${{ secrets.KORREKTOR_SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$PW" ]; then
            echo "::warning::No signing key in secrets (run scripts/setup-signing.sh): building a test APK, no release is published"
            exit 0
          fi
          KEY="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEY"
          if ! keytool -list -keystore "$KEY" -storetype PKCS12 -storepass:env PW -alias korrektor >/dev/null 2>&1; then
            echo "::error::The signing key in secrets cannot be opened with KORREKTOR_SIGNING_PASSWORD: run scripts/setup-signing.sh again"
            exit 1
          fi
          {
            echo "KORREKTOR_KEYSTORE=$KEY"
            echo "KORREKTOR_KEY_ALIAS=korrektor"
            echo "SIGNED=1"
          } >> "$GITHUB_ENV"

      # The runner already has the Android SDK (ANDROID_HOME).
      - name: Build APK
        working-directory: android
        env:
          KORREKTOR_STORE_PASSWORD: ${{ secrets.KORREKTOR_SIGNING_PASSWORD }}
          KORREKTOR_KEY_PASSWORD: ${{ secrets.KORREKTOR_SIGNING_PASSWORD }}
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "APP_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APP_NAME=$NAME" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease -PversionCode=$CODE -PversionName=$NAME
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/korrektor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: korrektor-${{ env.APP_NAME }}
          path: korrektor.apk

      # Releases feed the in-app updater, so only signed builds from main are published.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-${APP_CODE}" korrektor.apk \
            --title "Корректор ${APP_NAME} (бета)" \
            --notes "Приложение Корректор для Android. Установите korrektor.apk или обновите на вкладке «Ещё» в самом приложении." \
            --latest

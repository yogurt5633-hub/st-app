name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        env:
          # The signing key lives only in repository secrets, never in the code.
          KORREKTOR_KEYSTORE_BASE64: ${{ secrets.KORREKTOR_KEYSTORE_BASE64 }}
          KORREKTOR_STORE_PASSWORD: ${{ secrets.KORREKTOR_STORE_PASSWORD }}
          KORREKTOR_KEY_ALIAS: ${{ secrets.KORREKTOR_KEY_ALIAS }}
          KORREKTOR_KEY_PASSWORD: ${{ secrets.KORREKTOR_KEY_PASSWORD }}
        run: |
          if [ -n "$KORREKTOR_KEYSTORE_BASE64" ]; then
            echo "$KORREKTOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KORREKTOR_KEYSTORE="$RUNNER_TEMP/release.jks"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in secrets: building a test APK with a temporary key, no release is published"
          fi
          CODE=$((100 + GITHUB_RUN_NUMBER))
          NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "APP_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APP_NAME=$NAME" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease -PversionCode=$CODE -PversionName=$NAME
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/korrektor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: korrektor-${{ env.APP_NAME }}
          path: korrektor.apk

      # Releases feed the in-app updater, so only signed builds from main are published.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-${APP_CODE}" korrektor.apk \
            --title "Корректор ${APP_NAME}" \
            --notes "Приложение Корректор для Android. Установите korrektor.apk или обновите на вкладке «Ещё» в самом приложении." \
            --latest

name: Tavernka
options:
  bundleIdPrefix: io.github.yogurt5633
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.4.30'
    CURRENT_PROJECT_VERSION: '2'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Tavernka:
    type: application
    platform: iOS
    sources: [Tavernka]
    preBuildScripts:
      - name: Prepare existing Tavernka icon
        script: /usr/bin/sips -z 1024 1024 "$SRCROOT/../plugin/app/icons/icon-512.png" --out "$SRCROOT/Tavernka/Assets.xcassets/AppIcon.appiconset/icon.png"
        basedOnDependencyAnalysis: false
    info:
      path: Tavernka/Info.plist
      properties:
        CFBundleDisplayName: Тавернка
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Подключение к вашей SillyTavern на компьютере в той же сети.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yogurt5633.tavernka.ios
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TavernkaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Tavernka
  TavernkaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Tavernka
schemes:
  Tavernka:
    build:
      targets:
        Tavernka: all
    test:
      targets: [TavernkaTests, TavernkaUITests]
